server:
  port: 8080

spring:
  application:
    name: kiosco-api
  datasource:
    url: jdbc:h2:mem:kiosco
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.javainpro.kiosco: INFO
